<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text2SQL 智能体</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #181b24;
    --border: #2a2f3d;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --user-bubble: #2b3b5e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  header small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { margin-bottom: 16px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
  }
  .msg.user .bubble { background: var(--user-bubble); border-color: transparent; }
  .sql {
    margin-top: 8px;
    max-width: 85%;
    font-family: Consolas, monospace;
    font-size: 13px;
    color: #9ece6a;
    background: #11141b;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .sql::before { content: "SQL"; display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .status { color: var(--muted); font-size: 13px; }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<header>Text2SQL 智能体<small>自然语言查询数据库（只读）</small></header>
<main id="messages" aria-live="polite"></main>
<form id="form">
  <input id="input" type="text" placeholder="输入问题，例如：销量最高的 5 个产品是什么？"
         autocomplete="off" aria-label="输入问题" required>
  <button id="send" type="submit">发送</button>
</form>
<script>
const messages = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
let threadId = null;

function addMsg(role, text, sqlList) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  wrap.appendChild(bubble);
  for (const sql of sqlList || []) {
    const pre = document.createElement("div");
    pre.className = "sql";
    pre.textContent = sql;
    wrap.appendChild(pre);
  }
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  return wrap;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const content = input.value.trim();
  if (!content) return;
  input.value = "";
  send.disabled = true;
  addMsg("user", content);
  const pending = addMsg("assistant", "");
  pending.querySelector(".bubble").innerHTML = '<span class="status">思考中…</span>';
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content, thread_id: threadId }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    threadId = data.thread_id;
    pending.remove();
    addMsg("assistant", data.answer || "（无回答）", data.sql);
  } catch (err) {
    pending.querySelector(".bubble").innerHTML =
      '<span class="status">请求失败：' + err.message + "</span>";
  } finally {
    send.disabled = false;
    input.focus();
  }
});
input.focus();
</script>
</body>
</html>
