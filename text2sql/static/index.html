<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1117">
<title>Text2SQL 智能体</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #181b24;
    --border: #2a2f3d;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --user-bubble: #2b3b5e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  header small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { margin-bottom: 16px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    word-break: break-word;
    line-height: 1.6;
  }
  .msg.user .bubble { white-space: pre-wrap; }
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble pre {
    background: #11141b;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    font-size: 13px;
  }
  .bubble code {
    font-family: Consolas, monospace;
    font-size: 0.92em;
    background: #11141b;
    border-radius: 4px;
    padding: 1px 5px;
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble table { border-collapse: collapse; margin: 8px 0; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }
  .bubble th { background: #11141b; }
  .bubble a { color: var(--accent); }
  .bubble blockquote {
    margin: 8px 0;
    padding-left: 12px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  .msg.user .bubble { background: var(--user-bubble); border-color: transparent; }
  .sql {
    margin-top: 8px;
    max-width: 85%;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .sql::before { content: "SQL"; display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .sql code,
  .sql code.hljs {
    display: block;
    font-family: Consolas, monospace;
    font-size: 13px;
    background: #11141b;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .status { color: var(--muted); font-size: 13px; }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
  }
  button {
    padding: 12px 22px;
    min-height: 44px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #3d7bef; }
  button:active { background: #2f6bd8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<header>Text2SQL 智能体<small>自然语言查询数据库（只读）</small></header>
<main id="messages" aria-live="polite"></main>
<form id="form">
  <input id="input" type="text" placeholder="输入问题，例如：销量最高的 5 个产品是什么？"
         autocomplete="off" aria-label="输入问题" required>
  <button id="send" type="submit">发送</button>
</form>
<script>
const messages = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
let threadId = null;

function highlightSqlText(text) {
  if (typeof hljs === "undefined") return text;
  try {
    return hljs.highlight(text, { language: "sql" }).value;
  } catch (err) {
    return text;
  }
}

function renderMarkdown(el, text) {
  try {
    el.innerHTML = DOMPurify.sanitize(marked.parse(text));
    // 本应用代码块均为 SQL，强制按 SQL 高亮（不依赖自动识别）
    el.querySelectorAll("pre code").forEach((block) => {
      block.innerHTML = highlightSqlText(block.textContent);
      block.classList.add("hljs");
    });
  } catch (err) {
    el.textContent = text;
  }
}

function addMsg(role, text, sqlList) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "assistant" && text) {
    renderMarkdown(bubble, text);
  } else {
    bubble.textContent = text;
  }
  wrap.appendChild(bubble);
  const seen = new Set();
  for (const sql of sqlList || []) {
    const norm = sql.trim();
    if (!norm) continue;
    if (seen.has(norm)) continue;
    // 正文 Markdown 里已经出现过的 SQL 不再重复陈列
    if (text && text.includes(norm)) continue;
    seen.add(norm);
    const pre = document.createElement("div");
    pre.className = "sql";
    const code = document.createElement("code");
    code.className = "language-sql hljs";
    code.innerHTML = highlightSqlText(sql);
    pre.appendChild(code);
    wrap.appendChild(pre);
  }
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  return wrap;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const content = input.value.trim();
  if (!content) return;
  input.value = "";
  send.disabled = true;
  addMsg("user", content);
  const pending = addMsg("assistant", "");
  pending.querySelector(".bubble").innerHTML = '<span class="status">思考中…</span>';
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content, thread_id: threadId }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    threadId = data.thread_id;
    pending.remove();
    addMsg("assistant", data.answer || "（无回答）", data.sql);
  } catch (err) {
    pending.querySelector(".bubble").innerHTML =
      '<span class="status">请求失败：' + err.message + "</span>";
    if (!pending.isConnected) messages.appendChild(pending);
  } finally {
    send.disabled = false;
    input.focus();
  }
});
input.focus();
</script>
</body>
</html>
