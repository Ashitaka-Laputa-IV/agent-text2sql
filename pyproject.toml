[project]
name = "agent-text2sql"
version = "0.1.0"
description = "基于 langchain 的自然语言转 SQL 智能体"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "openai>=1.5",
    "sqlalchemy>=2.0",
    "rich>=15.0.0",
    "deepagents>=0.6.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
package = false
